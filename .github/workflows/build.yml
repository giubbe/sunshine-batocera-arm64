---
name: Build Sunshine for Batocera ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - final-kms-audio-tuning
      - experimental/audio-priority-cap-sys-nice
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sunshine-batocera-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Native ARM64 build and audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout build harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Checkout exact Sunshine source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: LizardByte/Sunshine
          ref: 14ffa6fdaa53f7b51512be2b3d24f3939695403c
          path: source
          fetch-tags: true
          submodules: recursive

      - name: Verify source identity, runner, and upstream audio path
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C source rev-parse HEAD)" = 14ffa6fdaa53f7b51512be2b3d24f3939695403c
          test "$(git -C source describe --tags --exact-match HEAD)" = v2026.516.143833
          git -C source submodule status --recursive
          grep -nF 'pa_simple_read(mic.get()' source/src/platform/linux/audio.cpp
          if grep -RFn 'AUDIO_PROBE' source/src; then
            echo 'ERROR: audio diagnostic probe unexpectedly present' >&2
            exit 1
          fi
          if grep -RFn 'PIPELINE_TELEMETRY' source/src; then
            echo 'ERROR: video diagnostic telemetry unexpectedly present' >&2
            exit 1
          fi

      - name: Inject Raspberry Pi 5 PiSP converter
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/inject-pisp-software-converter.py
          grep -nF 'PISP_CONVERTER enabled' source/src/video.cpp
          git -C source diff --check
          git -C source diff -- src/video.cpp

      - name: Inject CAP_SYS_NICE thread-priority fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/inject-audio-priority-cap-sys-nice.py
          grep -nF 'CAP_SYS_NICE fallback: temporarily enabled for thread priority' source/src/platform/linux/misc.cpp
          grep -nF 'setpriority(PRIO_PROCESS, 0, linux_nice)' source/src/platform/linux/misc.cpp
          git -C source diff --check
          git -C source diff -- src/platform/linux/misc.cpp

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            file \
            git \
            libcap-dev \
            libcurl4-openssl-dev \
            libdrm-dev \
            libevdev-dev \
            libgbm-dev \
            libgl-dev \
            libicu-dev \
            libminiupnpc-dev \
            libnuma-dev \
            libopus-dev \
            libpulse-dev \
            libssl-dev \
            libsystemd-dev \
            libudev-dev \
            libva-dev \
            libwayland-dev \
            meson \
            ninja-build \
            nodejs \
            npm \
            patchelf \
            pkg-config \
            python3-jinja2 \
            python3-setuptools \
            systemd-dev \
            udev

      - name: Build pinned libpisp 1.7.0
        shell: bash
        run: |
          set -Eeuo pipefail
          git init libpisp
          git -C libpisp remote add origin https://github.com/raspberrypi/libpisp.git
          git -C libpisp fetch --depth=1 origin f8a5eb2af4c5dea76442785ef42b2fb1aa9e62f9
          git -C libpisp checkout --detach FETCH_HEAD
          test "$(git -C libpisp rev-parse HEAD)" = f8a5eb2af4c5dea76442785ef42b2fb1aa9e62f9
          meson setup libpisp/build libpisp \
            --prefix="$GITHUB_WORKSPACE/pisp-prefix" \
            --wrap-mode=forcefallback \
            -Dbuildtype=release \
            -Ddefault_library=static \
            -Dc_args='-O3 -mcpu=cortex-a76 -mtune=cortex-a76' \
            -Dcpp_args='-O3 -mcpu=cortex-a76 -mtune=cortex-a76' \
            -Dlogging=disabled \
            -Dexamples=false \
            -Dgstreamer=disabled
          meson compile -C libpisp/build --verbose 2>&1 | tee libpisp-build.log
          awk '
            / -c / && / -o / && /\.o([[:space:]]|$)/ &&
            /-O3([[:space:]]|$)/ &&
            /-mcpu=cortex-a76([[:space:]]|$)/ &&
            /-mtune=cortex-a76([[:space:]]|$)/ { found=1 }
            END { exit !found }
          ' libpisp-build.log
          meson install -C libpisp/build
          test -f pisp-prefix/lib/aarch64-linux-gnu/libpisp.a || test -f pisp-prefix/lib/libpisp.a
          find pisp-prefix -maxdepth 4 -type f -print

      - name: Build, package, and audit
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/pisp-prefix
          PKG_CONFIG_PATH: ${{ github.workspace }}/pisp-prefix/lib/aarch64-linux-gnu/pkgconfig:${{ github.workspace }}/pisp-prefix/lib/pkgconfig
          PISP_PREFIX: ${{ github.workspace }}/pisp-prefix
        run: |
          set -Eeuo pipefail
          chmod +x ci/build-package.sh ci/audit-package.sh
          ci/build-package.sh 2>&1 | tee build-complete.log
          awk '
            / -c / && / -o / && /CMakeFiles\/sunshine\.dir\/.*\.o([[:space:]]|$)/ &&
            /-O3([[:space:]]|$)/ &&
            /-mcpu=cortex-a76([[:space:]]|$)/ &&
            /-mtune=cortex-a76([[:space:]]|$)/ { found=1 }
            END { exit !found }
          ' build-complete.log
          awk '
            !/ -c / && / -o sunshine([[:space:]]|$)/ &&
            /-flto(=[^[:space:]]+)?([[:space:]]|$)/ { found=1 }
            END { exit !found }
          ' build-complete.log
          mv build-complete.log artifacts/build-complete.log
          mv libpisp-build.log artifacts/libpisp-build.log

      - name: Upload package, checksum, logs, and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sunshine-batocera-arm64-v2026.516.143833
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
