---
name: Build Sunshine for Batocera ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - final-kms-audio-tuning
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sunshine-batocera-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Native ARM64 build and audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90

    steps:
      - name: Checkout build harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Checkout exact Sunshine source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: LizardByte/Sunshine
          ref: 14ffa6fdaa53f7b51512be2b3d24f3939695403c
          path: source
          fetch-tags: true
          submodules: recursive

      - name: Verify source identity and runner
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(uname -m)" = aarch64
          test "$(git -C source rev-parse HEAD)" = 14ffa6fdaa53f7b51512be2b3d24f3939695403c
          git -C source describe --tags --exact-match HEAD
          git -C source submodule status --recursive

      - name: Apply Batocera audio capture patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git -C source apply --check ../patches/0001-linux-audio-pa-stream-callback.patch
          git -C source apply ../patches/0001-linux-audio-pa-stream-callback.patch
          grep -nF 'pa_stream_connect_record(mic->stream.get()' source/src/platform/linux/audio.cpp
          grep -nF 'pa_stream_set_read_callback(mic->stream.get()' source/src/platform/linux/audio.cpp
          if grep -nF 'pa_simple_read(mic.get()' source/src/platform/linux/audio.cpp; then
            echo 'ERROR: pa_simple_read capture path still present after patch' >&2
            exit 1
          fi

      - name: Inject pre/post Opus audio diagnostic probe
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/inject-audio-opus-probe.py
          grep -nF 'AUDIO_PROBE enabled' source/src/audio.cpp
          grep -nF 'AUDIO_PROBE complete' source/src/audio.cpp
          git -C source diff --check

      - name: Inject video pipeline telemetry
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/inject-video-pipeline-telemetry.py source/src/video.cpp
          grep -nF 'PIPELINE_TELEMETRY' source/src/video.cpp

      - name: Inject Raspberry Pi 5 PiSP converter
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/inject-pisp-software-converter.py
          grep -nF 'PISP_CONVERTER enabled' source/src/video.cpp
          git -C source diff --check
          git -C source diff -- src/video.cpp

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            file \
            git \
            libcap-dev \
            libcurl4-openssl-dev \
            libdrm-dev \
            libevdev-dev \
            libgbm-dev \
            libgl-dev \
            libicu-dev \
            libminiupnpc-dev \
            libnuma-dev \
            libopus-dev \
            libpulse-dev \
            libssl-dev \
            libsystemd-dev \
            libudev-dev \
            libva-dev \
            libwayland-dev \
            meson \
            ninja-build \
            nodejs \
            npm \
            patchelf \
            pkg-config \
            python3-jinja2 \
            python3-setuptools \
            systemd-dev \
            udev

      - name: Build pinned libpisp 1.7.0
        shell: bash
        run: |
          set -Eeuo pipefail
          git init libpisp
          git -C libpisp remote add origin https://github.com/raspberrypi/libpisp.git
          git -C libpisp fetch --depth=1 origin f8a5eb2af4c5dea76442785ef42b2fb1aa9e62f9
          git -C libpisp checkout --detach FETCH_HEAD
          test "$(git -C libpisp rev-parse HEAD)" = f8a5eb2af4c5dea76442785ef42b2fb1aa9e62f9
          meson setup libpisp/build libpisp \
            --prefix="$GITHUB_WORKSPACE/pisp-prefix" \
            --wrap-mode=forcefallback \
            -Dbuildtype=release \
            -Ddefault_library=static \
            -Dlogging=disabled \
            -Dexamples=false \
            -Dgstreamer=disabled
          meson compile -C libpisp/build
          meson install -C libpisp/build
          test -f pisp-prefix/lib/aarch64-linux-gnu/libpisp.a || test -f pisp-prefix/lib/libpisp.a
          find pisp-prefix -maxdepth 4 -type f -print

      - name: Build, package, and audit
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/pisp-prefix
          PKG_CONFIG_PATH: ${{ github.workspace }}/pisp-prefix/lib/aarch64-linux-gnu/pkgconfig:${{ github.workspace }}/pisp-prefix/lib/pkgconfig
          PISP_PREFIX: ${{ github.workspace }}/pisp-prefix
        run: |
          set -o pipefail
          chmod +x ci/build-package.sh ci/audit-package.sh
          ci/build-package.sh 2>&1 | tee build-complete.log
          mv build-complete.log artifacts/build-complete.log

      - name: Upload package, checksum, logs, and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sunshine-batocera-arm64-v2026.516.143833
          path: |
            artifacts/
            build-complete.log
          if-no-files-found: warn
          retention-days: 30
