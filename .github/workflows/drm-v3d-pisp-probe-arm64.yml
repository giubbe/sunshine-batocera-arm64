name: Build DRM V3D PiSP probe ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/drm-v3d-pisp-probe.cpp'
      - '.github/workflows/drm-v3d-pisp-probe-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git meson ninja-build g++ pkg-config ca-certificates \
            libdrm-dev libegl1-mesa-dev libgles2-mesa-dev libgbm-dev

      - name: Fetch pinned libpisp
        run: |
          git clone https://github.com/raspberrypi/libpisp.git libpisp
          cd libpisp
          git checkout f8a5eb2af4c5dea76442785ef42b2fb1aa9e62f9

      - name: Build static libpisp
        run: |
          cd libpisp
          meson setup build \
            --wrap-mode=forcefallback \
            -Dbuildtype=release \
            -Ddefault_library=static \
            -Dlogging=disabled \
            -Dexamples=false \
            -Dgstreamer=disabled
          meson compile -C build

      - name: Compile probe
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra \
            tools/drm-v3d-pisp-probe.cpp \
            -Ilibpisp/src -Ilibpisp/src/libpisp -Ilibpisp/include -Ilibpisp/build \
            -I/usr/include/libdrm \
            -Llibpisp/build/src -lpisp \
            $(pkg-config --cflags --libs libdrm egl glesv2 gbm) \
            -pthread -ldl \
            -o drm-v3d-pisp-probe
          file drm-v3d-pisp-probe
          ldd drm-v3d-pisp-probe

      - name: Package artifact
        run: |
          mkdir -p artifact/share/libpisp
          cp drm-v3d-pisp-probe artifact/
          cp libpisp/src/libpisp/backend/backend_default_config.json artifact/share/libpisp/
          cat > artifact/BUILDINFO <<'EOF'
          Probe: DRM XR24 -> EGL/V3D -> PiSP-owned RGB888 DMA-BUF -> PiSP YUV420P
          libpisp commit: f8a5eb2af4c5dea76442785ef42b2fb1aa9e62f9
          Runtime target: Batocera ARM64 / Raspberry Pi 5
          EOF
          (cd artifact && sha256sum drm-v3d-pisp-probe share/libpisp/backend_default_config.json > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: drm-v3d-pisp-probe-batocera-arm64
          path: artifact/
          retention-days: 7
