name: Build Sunshine swscale benchmark ARM64

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/swscale-bgr0-yuv420-bench.cpp'
      - '.github/workflows/swscale-bgr0-yuv420-bench-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libswscale-dev libavutil-dev

      - name: Compile benchmark
        run: |
          c++ -std=c++20 -O3 -march=armv8-a -Wall -Wextra \
            tools/swscale-bgr0-yuv420-bench.cpp \
            -ldl \
            -o swscale-bgr0-yuv420-bench
          file swscale-bgr0-yuv420-bench
          echo 'Direct FFmpeg DT_NEEDED entries must be absent:'
          if readelf -d swscale-bgr0-yuv420-bench | grep -E 'lib(swscale|avutil)\.so'; then
            echo 'FAIL: benchmark linked directly to FFmpeg'
            exit 1
          fi
          ldd swscale-bgr0-yuv420-bench

      - name: Package artifact
        run: |
          mkdir artifact
          cp swscale-bgr0-yuv420-bench artifact/
          (cd artifact && sha256sum swscale-bgr0-yuv420-bench > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: swscale-bgr0-yuv420-bench-batocera-arm64
          path: artifact/
          retention-days: 7
